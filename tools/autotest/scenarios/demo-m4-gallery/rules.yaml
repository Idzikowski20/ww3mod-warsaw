Player:
	-ConquestVictoryConditions:
	MapLayers:
		ExploredMapCheckboxEnabled: true
		FogCheckboxEnabled: false

World:
	-StartGameNotification:
	-SpawnStartingUnits:
	-MapStartingLocations:
	-CrateSpawner:
	MusicPlaylist:
		DisableWorldSounds: false
	LuaScript:
		Scripts: test-helpers.lua, balance-helpers.lua, demo-m4-gallery.lua

^Combatant:
	AutoTarget:
		ScanRadius: 30
		InitialStance: FireAtWill
		InitialStanceAI: FireAtWill
		InitialEngagementStance: Hunt
		InitialEngagementStanceAI: Hunt
		MinimumScanTimeInterval: 16
		MaximumScanTimeInterval: 32

# The target survives, so every T-90 keeps tracking it: the frames show where the turrets point.
abrams:
	Health:
		HP: 100000000
