# Aircraft (M4): helicopters and jets. Rotor nodes spin in the idle and move clips; jets have no clips.
# A10.Airstrike and FROG.Airstrike inherit A10 / FROG and so their models. Every husk variant is listed,
# although the .EMP / .moving ones would inherit it from their base husk.

