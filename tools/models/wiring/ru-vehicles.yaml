# ru-vehicles: Russian vehicles and the neutral support vehicles (TRUK, MSAR, MNLY, LCCV). Fragment for
# mods/ww3mod/rules/models-3d.yaml. Models: tools/models/units/<model>.py; credits: ru-vehicles-credits.md.
# MCV, MCV2, MCV.ai and MCV2.ai are not wired: they live only in rules/ingame/old.yaml, which mod.yaml does
# not load (mcvs.yaml is all comments). LCCV is the live MCV; its husk is MCV.Husk.

btr:
	WithMeshBody:
		Model: btr.glb
		Scale: 2
		TurretNodes:
			turret: primary

btr.husk:
	WithMeshBody:
		Model: btr-wreck.glb
		Scale: 2

bmp2:
	WithMeshBody:
		Model: bmp2.glb
		Scale: 2
		TurretNodes:
			turret: primary

bmp2.husk:
	WithMeshBody:
