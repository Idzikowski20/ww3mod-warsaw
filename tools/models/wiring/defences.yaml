# Defences and base buildings (M4), merged over their definitions like rules/models-3d.yaml. Built by
# tools/models/units/<model>.py (_defences.py); sources: tools/models/wiring/defences-credits.md.
# Scale = the actor's footprint (8 m a cell) over the model's real size. Walls, fences and gates
# (SBAG BRIK FENC BARB CYCL WOOD HGATE VGATE) have models but are not wired: they need engine support.

