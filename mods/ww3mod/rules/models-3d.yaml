# --- us-vehicles.yaml ---

# us-vehicles: US Army ground vehicles. Fragment for mods/ww3mod/rules/models-3d.yaml (tools/models/wire.py).
# Models: tools/models/units/<model>.py; credits: us-vehicles-credits.md. Wheeled units (humvee,
# strykershorad, HIMARS) have wheel_<n> nodes turned by the move clip; idle holds them still.
# Turreted Offset / Armament@1 LocalOffset put the turret pivot and muzzle where the model has them
# (tools/models/muzzle.py where the model has a barrel node, else measured on the model).

humvee:
	WithMeshBody:
		Model: humvee.glb
		Scale: 2
