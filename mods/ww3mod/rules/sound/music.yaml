# Music by juanjo_sound (Michael Barker), https://juanjosound.itch.io/ -- "FPS Menu Music Themes".
# Credited in CREDITS.md. Files: bits/sounds/music/juanjo1..5.ogg (Ogg Vorbis q5, Git LFS).
# VolumeModifier 0.7: these masters measure -16 to -19 LUFS, several dB hotter than the old .aud tracks.
# Main menu (shellmap) and every match start on a random track: MusicPlaylist picks the first song from
# its shuffled list when StartingMusic is unset. Victory/defeat themes are set in rules/world.yaml.
