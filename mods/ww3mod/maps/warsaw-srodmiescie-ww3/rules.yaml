World:
	LuaScript:
	MapBuildRadius:
		AllyBuildRadiusCheckboxEnabled: True
	MapOptions:
		ShortGameCheckboxEnabled: True
		TechLevelDropdownVisible: True
		FogCheckboxVisible: True
		ExploredMapCheckboxVisible: True
		CratesCheckboxVisible: True
		StartingUnitsDropdownVisible: True
		StartingCashDropdownVisible: True
	# 3D Warsaw: GUGiK LoD2 buildings and OSM streets, built by tools/warsaw/build_city.py.
	CityMap:
		# The ground is the 3D street layer (streets.mesh); the orthophoto is only draped on the roofs.
		Ground:

# One per GUGiK building; map.yaml gives each its mesh (`CityBuilding: <index>`).
warsawbuilding:
	Interactable:
	CityBuilding:
	BodyOrientation:
		QuantizedFacings: 1
	Health:
		HP: 80000
	Armor:
		Type: Concrete
		Thickness: 1000
	HitShape:
		UseTargetableCellsOffsets: true
		Type: Rectangle
			VerticalTopOffset: 1024
			TopLeft: -512, -512
			BottomRight: 512, 512
	Targetable:
		TargetTypes: Ground, C4, DetonateAttack, Structure
	BlocksProjectiles:
	AppearsOnMiniMap:
	# The minimap asks every actor whether fog hides it; city blocks are mapped terrain, always known.
	AlwaysVisible:
	Tooltip:
		Name: Building
	Explodes:
		Weapon: BuildingExplode
		EmptyWeapon: BuildingExplode
	ScriptTriggers:
	MapEditorData:
		Categories: Civilian building
